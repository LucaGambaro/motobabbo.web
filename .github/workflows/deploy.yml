name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"] # o "master"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm' # o 'yarn' / 'pnpm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build # Assicurati che questo comando generi la cartella /dist

      - name: Setup Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist' # Cartella da pubblicare

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4